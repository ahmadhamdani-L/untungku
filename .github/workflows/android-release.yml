name: Signed Android AAB
on:
  workflow_dispatch:
    inputs:
      confirm_signed_build:
        description: 'Build with the existing owner upload key'
        type: boolean
        required: true
        default: false
      ad_profile:
        description: 'Ad profile (owner uses supplied IDs; no automatic full-screen ads)'
        type: choice
        options: [offline, google-test, owner]
        default: offline
      confirm_owner_ads:
        description: 'Use owner IDs; account/consent setup and device validation still require owner review'
        type: boolean
        default: false
      publish_to_play:
        description: 'Upload and release the signed owner build to Google Play'
        type: boolean
        default: false
      play_track:
        description: 'Google Play destination track'
        type: choice
        options: [internal, production]
        default: internal
concurrency:
  group: android-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bundle:
    if: inputs.confirm_signed_build
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AD_CONFIG_PATH: ${{ inputs.ad_profile == 'owner' && 'config/admob-release.json' || inputs.ad_profile == 'google-test' && 'config/google-test.json' || 'config/development.json' }}
      CONFIRM_OWNER_ADS: ${{ inputs.confirm_owner_ads }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/validate_release.py
      - name: Validate Play publication settings
        if: inputs.publish_to_play
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: python
        run: |
          import json, os
          if '${{ inputs.ad_profile }}' != 'owner':
              raise SystemExit('Play publication requires the owner ad profile')
          credentials = json.loads(os.environ['PLAY_SERVICE_ACCOUNT'] or '{}')
          if not credentials.get('client_email') or not credentials.get('private_key'):
              raise SystemExit('Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON release secret')
      - name: Set Android AdMob app ID from selected profile
        shell: python
        run: |
          import json,os
          config=json.load(open(os.environ['AD_CONFIG_PATH']))
          app_id=config.get('ADMOB_ANDROID_APP_ID','ca-app-pub-3940256099942544~3347511713')
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('ADMOB_ANDROID_APP_ID='+app_id+'\n')
      - name: Prepare signing material
        shell: python
        run: |
          import os,base64,pathlib
          pathlib.Path('android/app/release.jks').write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'],validate=True))
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 -m unittest discover -s tool -p "test_*.py"
      - run: flutter analyze
      - run: flutter test
      - run: flutter test test/ads_consent_test.dart --dart-define=ADMOB_ENABLED=true --dart-define=ADMOB_USE_MOCK=false
      - run: flutter build appbundle --release --dart-define-from-file="$AD_CONFIG_PATH"
      - run: test -s build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: untungku-signed-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Publish signed bundle to Google Play
        if: inputs.publish_to_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: id.untungku.untungku_pro
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.play_track }}
          status: completed
          whatsNewDirectory: docs/store-listing/whatsnew
      - if: always()
        run: rm -f android/app/release.jks
